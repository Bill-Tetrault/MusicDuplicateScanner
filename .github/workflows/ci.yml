name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    # Core logic + tests are pure PowerShell with no WPF dependency, so this
    # runs on ubuntu-latest for speed. A separate Windows smoke-test job below
    # verifies the GUI script at least parses cleanly on a real Windows agent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer and Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize
          if ($results | Where-Object Severity -eq 'Error') {
            throw 'PSScriptAnalyzer found Error-severity issues.'
          }

      - name: Run Pester tests
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled = $true
          $cfg.TestResult.OutputPath = './testResults.xml'
          Invoke-Pester -Configuration $cfg

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: testResults.xml

  windows-smoke-test:
    # Confirms the GUI script at least parses without syntax errors on a
    # real Windows PowerShell host. It does not launch the window (no
    # display in CI) - full UI verification remains a manual test on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse GUI script for syntax errors
        shell: powershell
        run: |
          $errors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\src\MusicDuplicateScanner.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "Syntax errors found in MusicDuplicateScanner.ps1"
          }
          Write-Host "MusicDuplicateScanner.ps1 parses cleanly on Windows PowerShell."
