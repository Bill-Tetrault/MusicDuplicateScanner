name: Sync Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  sync-wiki:
    name: Publish wiki/ → GitHub Wiki
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push to the .wiki.git repo

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can read last commit message

      - name: Checkout GitHub Wiki repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-repo
          # Uses GITHUB_TOKEN automatically; no extra secret needed as long as
          # Settings → Actions → "Read and write permissions" is enabled and
          # the Wiki tab is enabled for the repository.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync wiki/ → wiki repo
        run: |
          # Copy every .md file from wiki/ into the wiki repo root.
          # The GitHub Wiki expects files at the root of its git repo.
          rsync -av --delete --include='*.md' --exclude='*' wiki/ wiki-repo/

      - name: Commit and push (if changed)
        working-directory: wiki-repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          # Only commit if there are staged changes
          if git diff --cached --quiet; then
            echo "No wiki changes to publish."
          else
            # Use the triggering commit's message as context
            TRIGGER_MSG=$(git -C "$GITHUB_WORKSPACE" log -1 --pretty=format:"%s")
            git commit -m "wiki: sync from main — ${TRIGGER_MSG}"
            git push
            echo "Wiki published successfully."
          fi
